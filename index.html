<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>samplePage</title>
        <link href="styles.css" rel="stylesheet" />
    </head>
    <body>
    <main class="gradient">
        <header class="header-main">
            <div class="header-container">
                <div class="logo-area">
                    <h1 class="logo">facebook</h1>
                </div>
                <form class="login-form">
                    <div class="input-group">
                        <div class="checkbox-container">
                            <input type="checkbox" id="remember">
                            <label for="remember" class="sub-text">Remember Me</label>
                        </div>
                        <input type="text" id="email" name="email">
                    </div>

                    <div class="input-group">
                        <a href="#" class="sub-text link">Forgot your password?</a>
                        <input type="password" id="password" name="password">
                    </div>

                    <div class="input-group button-group">
                        <button type="submit" class="login-btn">Login</button>
                    </div>
                </form>
            </div>
        </header>
        <div class="home">
            <div class="left-content">
                <h2 class="content-label">Facebook helps you connect and share with the people in your life.</h2>
                <img src="homeIcon.png">
            </div>
            <div class="right-content">
                <div class="signup-heading">
                    <h2 class="content-label">Sign Up</h2>
                    <h3 class="content-label">It's free and anyone can join.</h3>
                </div>

                <form class="signup-form">
                    <div class="form-row">
                        <label for="accountName">Full Name:</label>
                        <input type="text" id="accountName" name="accountName">
                    </div>

                    <div class="form-row">
                        <label for="accountEmail">Your Email:</label>
                        <input type="text" id="accountEmail" name="accountEmail">
                    </div>

                    <div class="form-row">
                        <label for="accountPassword">New Password:</label>
                        <input type="password" id="accountPassword" name="password">
                    </div>
                    
                    <div class="form-row">
                        <label for="accountGender">I am:</label>
                        <div class="gender-container">
                        <select id="gender" name="gender">
                            <option value="">Select Gender:</option>
                            <option value="1">Male</option>
                            <option value="1">Female</option>
                        </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <label for="accountBirthday">Birthday:</label>
                        <div class="birthday-containers">
                            <select id="birth-month" name="birth_month">
                                <option value="">Month:</option>
                                <option value="1">Jan</option>
                                <option value="2">Feb</option>
                                <option value="3">Mar</option>
                                <option value="4">Apr</option>
                                <option value="5">May</option>
                                <option value="6">Jun</option>
                                <option value="7">Jul</option>
                                <option value="8">Aug</option>
                                <option value="9">Sep</option>
                                <option value="10">Oct</option>
                                <option value="11">Nov</option>
                                <option value="12">Dec</option>
                            </select>
                            <select id="birth-day" name="birth_day">
                                <option value="">Day:</option>
                                <option value="1">1</option>
                                <option value="2">2</option>
                                <option value="3">3</option>
                                <option value="4">4</option>
                                <option value="5">5</option>
                                <option value="6">6</option>
                                <option value="7">7</option>
                                <option value="8">8</option>
                                <option value="9">9</option>
                                <option value="10">10</option>
                                <option value="11">11</option>
                                <option value="12">12</option>
                                <option value="13">13</option>
                                <option value="14">14</option>
                                <option value="15">15</option>
                                <option value="16">16</option>
                                <option value="17">17</option>
                                <option value="18">18</option>
                                <option value="19">19</option>
                                <option value="20">20</option>
                                <option value="21">21</option>
                                <option value="22">22</option>
                                <option value="23">23</option>
                                <option value="24">24</option>
                                <option value="25">25</option>
                                <option value="26">26</option>
                                <option value="27">27</option>
                                <option value="28">28</option>
                                <option value="29">29</option>
                                <option value="30">30</option>
                                <option value="31">31</option>
                            </select>
                            <select id="birth-year" name="birth_year">
                                <option value="">Year:</option>
                                <option value="2012">2009</option>
                                <option value="2011">2008</option>
                                <option value="2010">2007</option>
                                <option value="2010">2006</option>
                            </select>
                        </div>
                    </div>    
                    <div class="form-row">
                        <button>Sign Up</button>
                    </div>
                </form>
            </div>
        </div>
        <hr>
    </main>
    </body>
    <footer class="page-footer">
        <div class="footer-container">
            <div class="footer-left">
                <p class="credit">Facebook © 2009</p>
                <p><a href="#" target="_blank">English (US)</a></p>
            </div>
            <div class="footer-right">
                <a href="#">Login</a>
                <a href="#">About</a>
                <a href="#">Advertising</a>
                <a href="#">Developers</a>
                <a href="#">Careers</a>
                <a href="#">Terms</a>
                <span class="divider">▪</span>
                <a href="#">Find Friends</a>
                <a href="#">Privacy</a>
                <a href="#">Mobile</a>
                <a href="#">Help</a>
            </div>
        </div>
    </footer>
</html>
